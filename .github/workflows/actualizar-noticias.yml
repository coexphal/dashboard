name: Actualizar noticias

on:
  schedule:
    - cron: "*/15 * * * *"   # cada 15 minutos
  workflow_dispatch:          # también se puede lanzar a mano

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Descargar el feed y generar noticias.json
        run: python3 actualizar_noticias.py
      - name: Guardar cambios si hay noticias nuevas
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add noticias.json
          git diff --cached --quiet || (git commit -m "Actualizar noticias" && git push)
